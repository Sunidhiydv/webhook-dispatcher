services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
      POSTGRES_DB: dispatcher
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redisdata:/data

  api:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://dispatcher:dispatcher@postgres:5432/dispatcher?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      API_KEY: dev-local-key
      SINK_SECRET: whsec_sink_dev_secret
      ALLOW_PRIVATE_TARGETS: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["api"]

  worker:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://dispatcher:dispatcher@postgres:5432/dispatcher?schema=public
      REDIS_URL: redis://redis:6379
      API_KEY: dev-local-key
      SINK_SECRET: whsec_sink_dev_secret
      ALLOW_PRIVATE_TARGETS: "true"
    depends_on:
      api:
        condition: service_healthy
    command: ["worker"]

volumes:
  pgdata:
  redisdata:
